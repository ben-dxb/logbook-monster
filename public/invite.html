<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logbook Monster – Accept invite</title>
<meta name="description" content="You have been invited to Logbook Monster: a meal plan, daily food tracker, training log, supplements and progress photos.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Logbook Monster">
<meta property="og:title" content="Logbook Monster – Accept invite">
<meta property="og:description" content="You have been invited to Logbook Monster: a meal plan, daily food tracker, training log, supplements and progress photos.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/archivo-latin-v5.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main class="card">
  <h1>Logbook Monster</h1>
  <p class="intro" id="intro">Checking your invite…</p>
  <p id="err" class="err" role="alert" hidden></p>
  <a id="google" class="google" href="/auth/google" hidden>Continue with Google</a>
  <div class="or" id="or" hidden><span>or pick a password</span></div>
  <form id="form" novalidate hidden>
    <input id="email" type="email" autocomplete="username" hidden readonly>
    <label class="f"><span class="lbl">Name (optional)</span><input id="name" autocomplete="name" maxlength="100"></label>
    <label class="f"><span class="lbl">Password (10+ characters)</span><input id="password" type="password" autocomplete="new-password" required minlength="10"></label>
    <button class="btn" id="submit" type="submit">Create my account</button>
  </form>
  <p class="switch"><a class="link" href="/login">Go to sign in</a></p>
  <p class="foot"><a href="/privacy">Privacy</a></p>
</main>
<script src="/invite.js"></script>
</body>
</html>
