<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logbook Monster – Sign in</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main class="card">
  <h1>Logbook Monster</h1>
  <p class="intro" id="intro">Sign in to see your days, history and weight.</p>
  <p id="err" class="err" role="alert" hidden></p>
  <a id="google" class="google" href="/auth/google" hidden>
    <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Continue with Google
  </a>
  <div class="or" id="or" hidden><span>or</span></div>
  <form id="form" novalidate>
    <label class="f" id="namef" hidden><span class="lbl">Name (optional)</span><input id="name" autocomplete="name" maxlength="100"></label>
    <label class="f"><span class="lbl">Email</span><input id="email" type="email" autocomplete="username" required></label>
    <label class="f"><span class="lbl">Password</span><input id="password" type="password" autocomplete="current-password" required minlength="10"></label>
    <button class="btn" id="submit" type="submit">Sign in</button>
  </form>
  <form id="second" novalidate hidden>
    <label class="f"><span class="lbl" id="codelbl">Code from your authenticator app</span><input id="code" autocomplete="one-time-code" inputmode="numeric" maxlength="11" spellcheck="false" autocapitalize="characters" required></label>
    <p class="hint"><span id="codehint">Lost your phone?</span> <button class="link" id="userec" type="button" aria-pressed="false" aria-controls="code">Use a recovery code</button></p>
    <button class="btn" id="codebtn" type="submit">Continue</button>
    <button class="link" id="restart" type="button">Start again</button>
  </form>
  <p class="switch" id="switch" hidden><button type="button" class="link" id="toggle">Create an account</button></p>
  <p class="foot"><a href="/privacy">Privacy</a><a id="contact" hidden>Contact</a></p>
</main>
<script src="/forms.js"></script>
<script src="/login.js"></script>
</body>
</html>
